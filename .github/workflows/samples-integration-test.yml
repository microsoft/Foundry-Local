name: Samples Build Check

on:
  pull_request:
    paths:
      - 'samples/**'
      - 'sdk_v2/**'
      - '.github/workflows/samples-integration-test.yml'
  push:
    paths:
      - 'samples/**'
      - 'sdk_v2/**'
      - '.github/workflows/samples-integration-test.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── C++ Samples ─────────────────────────────────────────────────────
  cpp-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Compile-check C++ samples
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem samples/cpp/*/main.cc | ForEach-Object {
            $name = $_.Directory.Name
            Write-Host "=== Checking: $name ==="
            clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror `
              -Isdk_v2/cpp/include -I. -fsyntax-only $_.FullName
            if ($LASTEXITCODE -ne 0) {
              $failed += $name
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed compile checks: $($failed -join ', ')"
            exit 1
          }

  # ── Python Samples ──────────────────────────────────────────────────
  python-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Configure pip for Azure Artifacts
        run: |
          pip config set global.index-url https://pkgs.dev.azure.com/aiinfra/PublicPackages/_packaging/ORT-Nightly/pypi/simple/
          pip config set global.extra-index-url https://pypi.org/simple/
          pip config set global.pre true

      - name: Build SDK wheel from source
        if: runner.os != 'Windows'
        working-directory: sdk_v2/python
        shell: pwsh
        run: |
          python -m pip install build cffi
          python -m build --wheel --outdir dist/

      - name: Install sample dependencies
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem samples/python/*/requirements.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Installing dependencies for $($_.Directory.Name)..."
            Push-Location $_.Directory.FullName
            pip install -r requirements.txt
            Pop-Location
          }

      - name: Syntax check Python samples
        shell: pwsh
        run: |
          $failed = @()
          $samples = Get-ChildItem samples/python/*/src/app.py -ErrorAction SilentlyContinue
          foreach ($sample in $samples) {
            $name = $sample.Directory.Parent.Name
            Write-Host "=== Checking: $name ==="
            python -m py_compile $sample.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED: $name"
              $failed += $name
            } else {
              Write-Host "OK: $name"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed syntax checks: $($failed -join ', ')"
            exit 1
          }

  # ── JavaScript Samples ──────────────────────────────────────────────
  js-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'

      - name: Type-check SDK from source
        working-directory: sdk_v2/js
        run: |
          npm install --ignore-scripts
          npm run build:ts

      - name: Syntax check JS samples
        shell: pwsh
        run: |
          $failed = @()
          # Find all sample app.js files (either in root or src/)
          $samples = @()
          $samples += Get-ChildItem samples/js/*/app.js -ErrorAction SilentlyContinue
          $samples += Get-ChildItem samples/js/*/src/app.js -ErrorAction SilentlyContinue
          foreach ($sample in $samples) {
            $dir = if ($sample.Directory.Name -eq 'src') { $sample.Directory.Parent } else { $sample.Directory }
            $name = $dir.Name
            Write-Host "=== Checking: $name ==="
            Push-Location $dir.FullName
            npm install --ignore-scripts --package-lock=false
            $installExitCode = $LASTEXITCODE
            if ($installExitCode -eq 0) {
              npm run check
            }
            $checkExitCode = $LASTEXITCODE
            Pop-Location
            if ($installExitCode -ne 0 -or $checkExitCode -ne 0) {
              Write-Host "FAILED: $name"
              $failed += $name
            } else {
              Write-Host "OK: $name"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed syntax checks: $($failed -join ', ')"
            exit 1
          }

  # ── C# Samples ─────────────────────────────────────────────────────
  cs-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            rid: win-x64
          - platform: macos
            rid: osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Build C# samples
        shell: pwsh
        run: |
          $failed = @()
          $projects = Get-ChildItem samples/cs -Recurse -Filter "*.csproj"
          foreach ($proj in $projects) {
            $name = $proj.BaseName
            Write-Host "`n=== Building: $name ==="
            dotnet restore $proj.FullName --runtime ${{ matrix.rid }} `
              --configfile samples/cs/nuget.config `
              -p:RuntimeIdentifiers=${{ matrix.rid }} 2>&1
            if ($LASTEXITCODE -eq 0) {
              dotnet build $proj.FullName --configuration Debug --no-restore `
                --runtime ${{ matrix.rid }} `
                -p:RuntimeIdentifiers=${{ matrix.rid }} 2>&1
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "BUILD FAILED: $name"
              $failed += $name
            } else {
              Write-Host "BUILD PASSED: $name"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed builds: $($failed -join ', ')"
            exit 1
          }

  # ── Rust Samples ────────────────────────────────────────────────────
  rust-samples:
    runs-on: ${{ matrix.platform }}-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: samples/rust -> target

      - name: Use crates.io directly
        shell: pwsh
        run: |
          # Remove crates-io redirect in SDK (points to Azure Artifacts)
          $configPath = "sdk_v2/rust/.cargo/config.toml"
          if (Test-Path $configPath) {
            Remove-Item $configPath
            Write-Host "Removed sdk_v2/rust/.cargo/config.toml"
          }
          # Remove crates-io redirect in samples
          $configPath = "samples/rust/.cargo/config.toml"
          if (Test-Path $configPath) {
            Remove-Item $configPath
            Write-Host "Removed samples/rust/.cargo/config.toml"
          }

      - name: Build Rust samples workspace
        working-directory: samples/rust
        run: cargo build --workspace

      - name: Clippy check
        working-directory: samples/rust
        run: cargo clippy --workspace -- -D warnings

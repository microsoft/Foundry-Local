# Real-model Engine gate, independent of the Generator/release packaging matrix.
# The paged Qwen fixture is also used by onnxruntime-genai's Engine integration CI.
parameters:
- name: buildConfig
  type: string
- name: ortVersion
  type: string
- name: genaiVersion
  type: string
  default: '0.16.0-dev1001407373'

stages:
- stage: cpp_test_engine
  displayName: 'C++ Engine: CUDA lifecycle tests'
  dependsOn: []
  jobs:
  - job: test
    timeoutInMinutes: 120
    pool:
      name: onnxruntime-Linux-GPU-A10
      os: linux
    steps:
    - checkout: self

    - template: steps-prefetch-nuget.yml
      parameters:
        ortVersion: ${{ parameters.ortVersion }}
        genaiVersion: ${{ parameters.genaiVersion }}
        linuxCuda: true

    - task: AzureCLI@2
      displayName: 'Stage and verify the real paged-KV model'
      inputs:
        azureSubscription: 'FoundryLocalCore-SP'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          model_root="$(Build.BinariesDirectory)/engine-model"
          mkdir -p "$model_root"
          az storage blob download-batch \
            --account-name foundrylocalmodels \
            --source staging \
            --pattern 'paged-attention/qwen2.5-0.5b-instruct/*' \
            --destination "$model_root" \
            --auth-mode login --overwrite true --only-show-errors
          cd "$model_root/paged-attention/qwen2.5-0.5b-instruct"
          sha256sum --check <<'SHA256'
          2d2b99a2a2d8049fd921d4483fb05f4fad22603f058fc1dffd5f73f9a36e148c  genai_config.json
          0d83e2d70d043d8b1723ae1d94619bc191b14b459bada10fda20a9d314ce53c5  model.onnx
          ad98abcb190a2085bca70110df04b04128c405fda8e0a526e2b7850d4d36a184  model.onnx.data
          9c5ae00e602b8860cbd784ba82a8aa14e8feecec692e7076590d014d7b7fdafa  tokenizer.json
          60bf17d6543b028dbd97ac7f4847418c96502006b80b4b1c57427c241c818224  tokenizer_config.json
          SHA256

    - bash: |
        set -euo pipefail
        nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
        docker build \
          --tag foundry-local-engine-ci \
          "$(Build.SourcesDirectory)/.pipelines/v2/docker/cuda"
        git clone https://github.com/microsoft/vcpkg.git "$(Build.BinariesDirectory)/engine-vcpkg"
        mkdir -p "$(Build.BinariesDirectory)/engine-home"
        docker run --rm --gpus all \
          --user "$(id -u):$(id -g)" \
          --volume "$(Build.SourcesDirectory):$(Build.SourcesDirectory)" \
          --volume "$(Build.BinariesDirectory):$(Build.BinariesDirectory)" \
          --volume "$(Build.BinariesDirectory)/engine-model:/models:ro" \
          --env "HOME=$(Build.BinariesDirectory)/engine-home" \
          --env "VCPKG_ROOT=$(Build.BinariesDirectory)/engine-vcpkg" \
          --env "NUGET_CACHE=$(Build.BinariesDirectory)/nuget_packages" \
          --env "ENGINE_GENAI_VERSION=${{ parameters.genaiVersion }}" \
          --env "BUILD_CONFIG=${{ parameters.buildConfig }}" \
          --env "FOUNDRY_LOCAL_DYNAMIC_ENGINE_TEST_REQUIRED=1" \
          --env "FOUNDRY_LOCAL_DYNAMIC_ENGINE_TEST_MODEL_PATH=/models/paged-attention/qwen2.5-0.5b-instruct" \
          --env "TF_BUILD=true" \
          --workdir "$(Build.SourcesDirectory)/sdk_v2/cpp" \
          foundry-local-engine-ci bash -c '
            set -euo pipefail
            python3 -m venv "$HOME/venv"
            python="$HOME/venv/bin/python"
            "$python" -m pip install "cmake==3.31.6"
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
            "$python" build.py --configure --build --skip_examples \
              --config "$BUILD_CONFIG" \
              --cmake_path "$HOME/venv/bin/cmake" \
              --cmake_extra_defines \
                "GENAI_FETCH_URL=$NUGET_CACHE/genai.zip" \
                "ORT_GENAI_VERSION=$ENGINE_GENAI_VERSION" \
                "ORT_FETCH_URL=$NUGET_CACHE/ort.zip" \
                "FOUNDRY_LOCAL_REQUIRE_DYNAMIC_ENGINE_TESTS=ON"
            build="$PWD/build/Linux/$BUILD_CONFIG"
            bin="$build/bin"
            cp "$build/_deps/genailib-src/runtimes/linux-x64/native/libonnxruntime-genai-cuda.so" "$bin/"
            cp "$build/_deps/ortlib-src/runtimes/linux-x64/native/libonnxruntime_providers_cuda.so" "$bin/"
            export LD_LIBRARY_PATH="$bin:${LD_LIBRARY_PATH:-}"
            results="$build/TestResults"
            mkdir -p "$results"
            cd "$bin"
            timeout --signal=TERM --kill-after=30s 10m ./foundry_local_tests \
              --gtest_filter="DynamicEngineChatTest.*" \
              --gtest_output="xml:$results/dynamic-engine.xml"
          '
      displayName: 'Build and run every dynamic Engine test on CUDA'

    # GTest succeeds when a filter selects zero tests or every test skips.
    # Require every lifecycle regression as well as successful execution of any new tests.
    - task: PowerShell@2
      displayName: 'Reject missing, skipped, or unexecuted Engine tests'
      inputs:
        targetType: inline
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          $path = "$(Build.SourcesDirectory)/sdk_v2/cpp/build/Linux/${{ parameters.buildConfig }}/TestResults/dynamic-engine.xml"
          [xml]$report = Get-Content -LiteralPath $path -Raw
          $suite = $report.testsuites.testsuite | Where-Object name -eq 'DynamicEngineChatTest'
          if (-not $suite) { throw 'The dynamic Engine suite did not run' }
          $cases = @($suite.testcase)
          $required = @(
            'RetainedContinuationReportsFreshPromptUsageParity',
            'MismatchedResidentPromptIsReplacedAndMatchesFreshReplay',
            'RunsTwoConcurrentSessions',
            'CapacityTimeoutFailsOnlyNewestWaitingConversation',
            'LateCancelAfterCompletedConversationRemovalIsNoOp',
            'CancellationRebuildsCommittedHistoryWithinBudget',
            'UnloadsAfterSessionsClose'
          )
          foreach ($name in $required) {
            if ($name -notin $cases.name) { throw "Required Engine test is missing: $name" }
          }
          foreach ($case in $cases) {
            if ($case.status -ne 'run' -or $case.result -ne 'completed' -or
                $case.SelectNodes('skipped|failure|error').Count -gt 0) {
              throw "Engine test did not pass without skipping: $($case.name)"
            }
          }
          Write-Host "All $($cases.Count) dynamic Engine tests executed and passed; none skipped."

    - task: PublishTestResults@2
      displayName: 'Publish Engine lifecycle results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '$(Build.SourcesDirectory)/sdk_v2/cpp/build/Linux/${{ parameters.buildConfig }}/TestResults/dynamic-engine.xml'
        testRunTitle: 'C++ dynamic Engine (CUDA, paged Qwen)'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
